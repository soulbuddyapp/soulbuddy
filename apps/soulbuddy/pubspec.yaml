name: soulbuddy
description: "A humble, local-first companion for prayer and spiritual remembrance."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  powersync: 1.17.0
  flutter_riverpod: ^3.3.2
  go_router: 17.2.3
  uuid: 4.5.2
  sqlite3: 2.9.4
  path: ^1.9.1
  path_provider: ^2.1.5
  flutter_secure_storage: ^10.3.1
  http: ^1.6.0
  url_launcher: ^6.3.2
  web: 1.1.1
  flutter_local_notifications: 20.1.0
  timezone: 0.10.1
  flutter_timezone: 5.1.0
  audioplayers: 6.7.1
  record: 6.2.1
  speech_to_text: 7.4.0
  idb_shim: 2.6.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  alchemist: ^0.14.0
  accessibility_tools: ^2.7.1
  crypto: ^3.0.6
  xml: ^6.6.1
  integration_test:
    sdk: flutter

dependency_overrides:
  powersync_core: 1.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/prayer_library.json
    - assets/content/editorial_manifest.json
    - assets/scripture/rsvce.db
    - assets/audio/feedback/
    - assets/audio/meditation/
  fonts:
    - family: Source Serif 4 Display
      fonts:
        - asset: assets/fonts/SourceSerif4Display-Semibold.ttf
          weight: 600
