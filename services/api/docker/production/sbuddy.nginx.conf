server {
    listen 80;
    listen [::]:80;
    server_name sbuddy.elbiblio.com;

    root /var/www/soulbuddy/current/public;
    index index.php;
    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Only these public OAuth metadata paths may bypass the dotfile denial below.
    location = /.well-known/oauth-protected-resource {
        try_files $uri /index.php?$query_string;
    }

    location = /.well-known/oauth-protected-resource/mcp {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        # PHP-FPM must receive the OAuth bearer token for per-user MCP authorization.
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass 127.0.0.1:9083;
        fastcgi_read_timeout 60s;
    }

    location ~ /\. {
        deny all;
    }
}
