      - SELECT id, owner_id, prayer_id, created_at FROM prayer_votes WHERE owner_id = bucket.owner_id
      - SELECT id, owner_id, local_date, prayer_id, personal_prayer_id, include_action, action_completed, created_at FROM today_prayers WHERE owner_id = bucket.owner_id
      - SELECT id, owner_id, starter_key, mode, status, current_revision_id, position, created_at, updated_at, archived_at FROM goals WHERE owner_id = bucket.owner_id
      - SELECT id, goal_id, owner_id, title, current_situation, why_it_matters, created_at, device_id FROM goal_revisions WHERE owner_id = bucket.owner_id
      - SELECT id, goal_id, owner_id, link_type, personal_prayer_id, library_prayer_id, encounter_id, voice_tablet_id, circle_id, translation, book, chapter, first_verse, last_verse, role, created_at, archived_at FROM goal_links WHERE owner_id = bucket.owner_id
