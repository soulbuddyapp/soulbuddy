# Candidate for MySQL 8 after the owner projection migration.
# Only authenticated owners receive private rows; recording bytes stay local.
bucket_definitions:
  private_account:
    parameters: SELECT public_id AS owner_id FROM users WHERE public_id = request.user_id()
    data:
      - SELECT id, owner_id, title, body, occurred_on, is_altar, created_at, updated_at, archived_at, current_revision_id, memory_type, sensitive, recall_enabled, recall_paused, recall_interval_days FROM encounters WHERE owner_id = bucket.owner_id
      - SELECT id, encounter_id, owner_id, title, body, created_at, device_id, memory_type, sensitive, recall_enabled, recall_paused, recall_interval_days FROM encounter_revisions WHERE owner_id = bucket.owner_id
      - SELECT id, encounter_id, owner_id, body, audio_encounter_id, local_date, created_at, device_id FROM memory_reflections WHERE owner_id = bucket.owner_id
      - SELECT id, owner_id, source_type, personal_prayer_id, library_prayer_id, prayer_revision_id, title, full_audio_id, refrain_audio_id, recording_device_id, created_at, updated_at, archived_at FROM voice_tablets WHERE owner_id = bucket.owner_id
      - SELECT id, owner_id, target_type, encounter_id, personal_prayer_id, library_prayer_id, voice_tablet_id, created_at, updated_at, archived_at FROM altar_items WHERE owner_id = bucket.owner_id
      - SELECT id, owner_id, altar_item_id, schedule_type, local_time, timezone, weekdays_mask, playback_mode, enabled, created_at, updated_at, archived_at FROM altar_rituals WHERE owner_id = bucket.owner_id
      - SELECT id, owner_id, release_item_id, local_date, started_at, ended_at, outcome, step_one_count, step_two_count, sound_key, narration_speed, created_at, updated_at FROM affirmation_prayer_sessions WHERE owner_id = bucket.owner_id
      - SELECT id, owner_id, title, style, reach, grounding, purpose, current_revision_id, created_at, updated_at, archived_at FROM personal_prayers WHERE owner_id = bucket.owner_id
      - SELECT id, prayer_id, owner_id, body, content_format, action, created_at, device_id FROM personal_prayer_revisions WHERE owner_id = bucket.owner_id
      - SELECT id, prayer_id, owner_id, link_type, encounter_id, translation, book, chapter, first_verse, last_verse, created_at FROM personal_prayer_links WHERE owner_id = bucket.owner_id
      - SELECT id, owner_id, purpose_key, name, local_time, timezone, duration_minutes, prayer_minutes, enabled, sound_key, prayer_type, prayer_id, person_id, created_at, updated_at, archived_at FROM sacred_hours WHERE owner_id = bucket.owner_id
      - SELECT id, owner_id, sacred_hour_id, due_at, local_date, status, prayer_session_id, created_at, updated_at FROM sacred_hour_occurrences WHERE owner_id = bucket.owner_id
