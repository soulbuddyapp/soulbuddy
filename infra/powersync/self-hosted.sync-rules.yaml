      - SELECT id, owner_id, name, relationship, cadence, local_time, timezone, weekdays_mask, created_at, updated_at, archived_at FROM prayer_people WHERE owner_id = bucket.owner_id
      - SELECT id, person_id, owner_id, local_date, occurrence_key, prayed_at, device_id FROM person_prayer_occurrences WHERE owner_id = bucket.owner_id
      - SELECT id, encounter_id, person_id, owner_id, created_at FROM encounter_person_links WHERE owner_id = bucket.owner_id
  public_prayers:
    data:
      - SELECT id, title, body, grounding, language_style, purpose, action, helpful_count, published_at, archived_at FROM library_prayers WHERE published_at IS NOT NULL
