name: Google Ads media

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/google-ads-media.yml'
      - 'marketing/google-ads/media/**'

permissions:
  contents: read

concurrency:
  group: google-ads-media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Package approved source images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: soulbuddy-ad-media-sources
          path: |
            marketing/store-listing/2026-09/sources/today-device.png
            marketing/store-listing/2026-09/sources/orientation-device.png
            marketing/store-listing/2026-09/brand/soulbuddy-icon-1024.png
            marketing/store-listing/2026-09/visuals/*.jpg
          if-no-files-found: error
          retention-days: 14
