name: Google Ads media

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/google-ads-media.yml'
      - 'marketing/google-ads/media/build_media.py'
      - 'marketing/google-ads/media/verify_media.py'
      - 'marketing/google-ads/media/README.md'

permissions:
  contents: read

concurrency:
  group: google-ads-media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-pil ffmpeg fontconfig fonts-urw-base35 fonts-inter
      - name: Render and verify approved media
        run: |
          /usr/bin/python3 marketing/google-ads/media/build_media.py --sources marketing/store-listing/2026-09 --output marketing/google-ads/media/export
          /usr/bin/python3 marketing/google-ads/media/verify_media.py marketing/google-ads/media/export marketing/store-listing/2026-09
      - name: Upload finished media
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: soulbuddy-google-ads-media
          path: |
            marketing/google-ads/media/export/images/*.png
            marketing/google-ads/media/export/videos/*.mp4
            marketing/google-ads/media/export/manifest.json
            marketing/google-ads/media/export/*.jpg
          if-no-files-found: error
          retention-days: 90
      - name: Commit verified media exports
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- marketing/google-ads/media/export/images/ marketing/google-ads/media/export/videos/ marketing/google-ads/media/export/manifest.json marketing/google-ads/media/export/*.jpg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(marketing): export verified Google Ads images and videos [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
