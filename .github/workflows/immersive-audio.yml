name: Immersive audio

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/immersive-audio.yml'
      - 'apps/soulbuddy/lib/**'
      - 'apps/soulbuddy/test/**'
      - 'apps/soulbuddy/pubspec.yaml'
      - 'apps/soulbuddy/pubspec.lock'
      - 'services/api/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/immersive-audio.yml'
      - 'apps/soulbuddy/lib/**'
      - 'apps/soulbuddy/test/**'
      - 'apps/soulbuddy/pubspec.yaml'
      - 'apps/soulbuddy/pubspec.lock'
      - 'services/api/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: immersive-audio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-audio:
    name: Flutter recording and playback
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/soulbuddy
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Flutter 3.35.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Prepare ignored Scripture test asset
        run: |
          # Focused tests supply their own Scripture data. The ignored
          # production database must still have a path in Flutter's bundle.
          New-Item -ItemType Directory -Force assets/scripture | Out-Null
          if (-not (Test-Path assets/scripture/rsvce.db)) {
            New-Item -ItemType File assets/scripture/rsvce.db | Out-Null
          }

      - name: Analyze changed Dart sources
        id: analyze_audio
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          $base = $env:BASE_SHA
          if ($base -notmatch '^[0-9a-f]{40}$' -or $base -eq ('0' * 40)) {
            $base = git merge-base HEAD origin/main
          }
          $changed = @(git diff --name-only --diff-filter=ACMR $base HEAD -- apps/soulbuddy/lib apps/soulbuddy/test)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $targets = @($changed | Where-Object { $_.EndsWith('.dart') } | ForEach-Object { $_.Substring('apps/soulbuddy/'.Length) })
          if ($targets.Count -gt 0) {
            Push-Location apps/soulbuddy
            dart format @targets
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Pop-Location
            git diff --output=audio-formatting.patch -- apps/soulbuddy
            Push-Location apps/soulbuddy
            flutter analyze --fatal-infos @targets
            $result = $LASTEXITCODE
            Pop-Location
            if ($result -ne 0) { exit $result }
          }
          git diff --check $base HEAD

      - name: Save Dart formatting suggestions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-formatting-${{ github.run_id }}
          path: audio-formatting.patch
          retention-days: 3
          if-no-files-found: ignore

      # Keep failures independent so a hung recorder cannot hide prayer or
      # formation results. All three steps still gate the job.
      - name: Verify capture, memories, and session ownership
        if: ${{ !cancelled() && steps.analyze_audio.outcome == 'success' }}
        timeout-minutes: 6
        run: flutter test --reporter expanded --timeout 2m test/core/playback test/core/feedback/feedback_sound_output_test.dart test/features/record test/features/remember

      - name: Verify prayer recording and playback
        if: ${{ !cancelled() && steps.analyze_audio.outcome == 'success' }}
        timeout-minutes: 6
        run: flutter test --reporter expanded --timeout 2m test/features/prayers

      - name: Verify recording after formation and in linked activities
        if: ${{ !cancelled() && steps.analyze_audio.outcome == 'success' }}
        timeout-minutes: 6
        run: flutter test --reporter expanded --timeout 2m test/features/daily_formation test/features/guards/guard_configuration_sheet_test.dart test/features/circles/circles_flow_test.dart test/features/circles/legacy_circle_migration_service_test.dart test/features/altar/altar_ritual_ui_test.dart test/features/altar/altar_memory_today_card_test.dart

  laravel-audio:
    name: Laravel audio metadata and sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Install Laravel dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel test environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Check audio metadata PHP style
        id: php-style
        run: ./vendor/bin/pint --test app/Domain/Sync/ApplySyncMutation.php app/Domain/Sync/ApplyPersonalPrayerMutation.php app/Domain/Sync/ApplyVoiceTabletAltarMutation.php app/Http/Controllers/Api/PrayerNarrationController.php database/migrations/2026_11_03_000000_add_audio_authoring_metadata.php tests/Feature/Sync/RecordedPrayerMutationTest.php tests/Feature/Sync/AudioReflectionMutationTest.php tests/Feature/PrayerNarration/PrayerNarrationTest.php

      - name: Verify sync ownership, rollback, and narration boundaries
        if: success() || steps.php-style.outcome == 'failure'
        run: php artisan test tests/Feature/Sync tests/Feature/PrayerNarration tests/Architecture/SyntheticSpiritualContentTest.php
