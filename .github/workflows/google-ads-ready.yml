name: Google Ads ready-to-run installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/google-ads-ready.yml'
      - 'marketing/google-ads/setup-google-ads.js'
      - 'marketing/google-ads/*.test.cjs'
      - 'marketing/google-ads/fixtures/**'
      - 'marketing/google-ads/build-ready-script.py'
      - 'marketing/google-ads/media/export/images/01-transformation-*.png'

permissions:
  contents: read

concurrency:
  group: google-ads-ready-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ready:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build image-embedded scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-pil
          /usr/bin/python3 marketing/google-ads/build-ready-script.py
      - name: Verify complete distributions
        run: |
          node --check marketing/google-ads/ready/SoulBuddy-Ready-to-Run.js
          node --check marketing/google-ads/ready/SoulBuddy-Preview-Check.js
          node --test marketing/google-ads/*.test.cjs
      - name: Upload installer and Preview-only checker
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: soulbuddy-ready-to-run
          path: |
            marketing/google-ads/ready/SoulBuddy-Ready-to-Run.js
            marketing/google-ads/ready/SoulBuddy-Preview-Check.js
            marketing/google-ads/ready/manifest.json
          if-no-files-found: error
          retention-days: 90
      - name: Commit verified distributions
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- marketing/google-ads/ready/SoulBuddy-Ready-to-Run.js marketing/google-ads/ready/SoulBuddy-Preview-Check.js marketing/google-ads/ready/manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(marketing): bundle installer and Preview-only diagnostic [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
