name: Android audio QA APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/soulbuddy/**'
      - 'scripts/qa/build_android_audio_apk.sh'
      - '.github/workflows/android-audio-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-audio-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  device-build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'feat/immersive-audio')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.35.7
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.21.0
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Build and inspect the isolated ARM64 APK
        shell: bash
        run: bash scripts/qa/build_android_audio_apk.sh

      - name: Upload the APK and installation notes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: soulbuddy-audio-qa-arm64-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/soulbuddy-audio-qa-artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
