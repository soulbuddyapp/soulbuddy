name: ChatGPT Life Planner MCP

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-life-planner.yml'
      - 'services/api/app/Domain/LifePlanning/**'
      - 'services/api/app/Http/Controllers/Chatgpt/**'
      - 'services/api/app/Http/Controllers/Api/Chatgpt*'
      - 'services/api/database/migrations/*life_planner*'
      - 'services/api/database/migrations/*chatgpt_oauth*'
      - 'services/api/routes/api.php'
      - 'services/api/routes/web.php'
      - 'services/api/bootstrap/app.php'
      - 'services/api/config/services.php'
      - 'services/api/tests/Feature/Chatgpt/**'
      - 'services/api/app/Providers/AppServiceProvider.php'
      - 'services/api/docker/production/sbuddy.nginx.conf'
      - 'integrations/chatgpt-plugin/**'
      - 'apps/soulbuddy/lib/core/identity/chatgpt_link_client.dart'
      - 'apps/soulbuddy/lib/core/identity/local_identity_providers.dart'
      - 'apps/soulbuddy/lib/features/settings/presentation/chatgpt_link_section.dart'
      - 'apps/soulbuddy/lib/features/settings/presentation/settings_screen.dart'
      - 'apps/soulbuddy/test/core/identity/chatgpt_link_client_test.dart'
      - 'apps/soulbuddy/test/features/settings/chatgpt_link_section_test.dart'
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-life-planner.yml'
      - 'services/api/app/Domain/LifePlanning/**'
      - 'services/api/app/Http/Controllers/Chatgpt/**'
      - 'services/api/app/Http/Controllers/Api/Chatgpt*'
      - 'services/api/database/migrations/*life_planner*'
      - 'services/api/database/migrations/*chatgpt_oauth*'
      - 'services/api/routes/api.php'
      - 'services/api/routes/web.php'
      - 'services/api/bootstrap/app.php'
      - 'services/api/config/services.php'
      - 'services/api/tests/Feature/Chatgpt/**'
      - 'apps/soulbuddy/lib/core/identity/chatgpt_link_client.dart'
      - 'apps/soulbuddy/lib/core/identity/local_identity_providers.dart'
      - 'apps/soulbuddy/lib/features/settings/presentation/chatgpt_link_section.dart'
      - 'apps/soulbuddy/lib/features/settings/presentation/settings_screen.dart'
      - 'apps/soulbuddy/test/core/identity/chatgpt_link_client_test.dart'
      - 'apps/soulbuddy/test/features/settings/chatgpt_link_section_test.dart'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  laravel-mcp:
    name: MCP and life planner regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite, openssl
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Check portable plugin package
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('../../integrations/chatgpt-plugin')
          plugin = json.loads((root / 'plugin.json').read_text())
          mcp = json.loads((root / 'mcp.json').read_text())
          assert plugin['name'] == 'soulbuddy-life'
          assert mcp['mcpServers']['soulbuddy']['url'] == 'https://sbuddy.elbiblio.com/mcp'
          assert mcp['mcpServers']['soulbuddy']['extensions']['com.openai']['auth']['type'] == 'mixed'
          extension = plugin['extensions']['com.openai']
          interface = extension['interface']
          for path in (extension['onboardingSkill'], interface['logo'], interface['composerIcon']):
              assert path.startswith('./') and (root / path).is_file(), path
          assert (root / 'skills/setup/references/daily-reminder.md').is_file(), 'Missing reminder task guidance'
          assert 'privacyPolicyURL' not in interface, 'Do not invent unreviewed policy URLs'
          assert 'termsOfServiceURL' not in interface, 'Do not invent unreviewed legal URLs'
          assert 'HTTP_AUTHORIZATION' in Path('docker/production/sbuddy.nginx.conf').read_text()
          print('Portable plugin package OK')
          PY
      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Lint PHP
        run: |
          for file in \
            app/Domain/LifePlanning/*.php \
            app/Http/Controllers/Chatgpt/*.php \
            app/Http/Controllers/Api/Chatgpt*.php \
            database/migrations/*life_planner*.php \
            database/migrations/*chatgpt_oauth*.php \
            tests/Feature/Chatgpt/*.php; do php -l "$file"; done
      - name: Feature and authorization regressions
        run: php artisan test tests/Feature/Chatgpt
      - name: Existing account/session and Goal regressions
        run: php artisan test tests/Feature/Auth tests/Feature/Accounts tests/Feature/Goals

  flutter-account-link:
    name: Flutter ChatGPT account linking
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/soulbuddy
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Prepare ignored Scripture asset for focused widget tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force assets/scripture | Out-Null
          if (-not (Test-Path assets/scripture/rsvce.db)) {
            New-Item -ItemType File assets/scripture/rsvce.db | Out-Null
          }
      - name: Format ChatGPT linkage
        shell: pwsh
        run: |
          dart format --output=none --set-exit-if-changed lib/core/identity/chatgpt_link_client.dart lib/core/identity/local_identity_providers.dart lib/features/settings/presentation/chatgpt_link_section.dart lib/features/settings/presentation/settings_screen.dart test/core/identity/chatgpt_link_client_test.dart test/features/settings/chatgpt_link_section_test.dart
      - name: Analyze account linking and Settings
        run: flutter analyze --fatal-infos lib/core/identity/chatgpt_link_client.dart lib/core/identity/local_identity_providers.dart lib/features/settings/presentation/chatgpt_link_section.dart lib/features/settings/presentation/settings_screen.dart
      - name: Test account linking and existing connection controls
        run: flutter test test/core/identity/chatgpt_link_client_test.dart test/features/settings/chatgpt_link_section_test.dart test/core/identity/account_email_link_client_test.dart test/features/settings/account_email_link_section_test.dart test/core/identity/telegram_link_client_test.dart test/features/settings/telegram_link_section_test.dart
