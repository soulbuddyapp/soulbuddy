name: Return and Guards

on:
  pull_request:
    paths:
      - '.github/workflows/return-guards.yml'
      - 'apps/soulbuddy/lib/features/guards/**'
      - 'apps/soulbuddy/lib/features/goals/data/goal_schema.dart'
      - 'apps/soulbuddy/lib/features/goals/domain/**'
      - 'apps/soulbuddy/lib/features/goals/providers/**'
      - 'apps/soulbuddy/lib/features/goals/presentation/goal_detail_screen.dart'
      - 'apps/soulbuddy/test/features/guards/**'
      - 'apps/soulbuddy/test/features/goals/goal_detail_screen_test.dart'
      - 'services/api/app/Domain/Sync/ApplyGoalSyncMutation.php'
      - 'services/api/app/Domain/Sync/GoalGuardSelectionSyncMutation.php'
      - 'services/api/app/Models/GoalGuardSelection.php'
      - 'services/api/database/migrations/*goal_guard*'
      - 'services/api/tests/Feature/Goals/GoalGuardSelectionSyncTest.php'
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - '.github/workflows/return-guards.yml'
      - 'apps/soulbuddy/lib/features/guards/**'
      - 'apps/soulbuddy/lib/features/goals/data/goal_schema.dart'
      - 'apps/soulbuddy/lib/features/goals/domain/**'
      - 'apps/soulbuddy/lib/features/goals/providers/**'
      - 'apps/soulbuddy/lib/features/goals/presentation/goal_detail_screen.dart'
      - 'apps/soulbuddy/test/features/guards/**'
      - 'apps/soulbuddy/test/features/goals/goal_detail_screen_test.dart'
      - 'services/api/app/Domain/Sync/ApplyGoalSyncMutation.php'
      - 'services/api/app/Domain/Sync/GoalGuardSelectionSyncMutation.php'
      - 'services/api/app/Models/GoalGuardSelection.php'
      - 'services/api/database/migrations/*goal_guard*'
      - 'services/api/tests/Feature/Goals/GoalGuardSelectionSyncTest.php'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: return-guards-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-return-guards:
    name: Flutter Return / guards
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/soulbuddy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter 3.35.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Prepare ignored Scripture asset placeholder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force assets/scripture | Out-Null
          if (-not (Test-Path assets/scripture/rsvce.db)) {
            New-Item -ItemType File assets/scripture/rsvce.db | Out-Null
          }

      - name: Normalize and check focused formatting
        id: dart-format
        continue-on-error: true
        shell: pwsh
        run: |
          dart format lib/features/guards lib/features/goals/data/goal_schema.dart lib/features/goals/presentation/goal_detail_screen.dart test/features/guards test/features/goals/goal_detail_screen_test.dart
          git diff --check
          git diff --exit-code -- lib/features/guards lib/features/goals/data/goal_schema.dart lib/features/goals/presentation/goal_detail_screen.dart test/features/guards test/features/goals/goal_detail_screen_test.dart

      - name: Analyze Return and guards
        id: flutter-analyze
        continue-on-error: true
        run: flutter analyze --fatal-infos lib/features/guards lib/features/goals/data/goal_schema.dart lib/features/goals/presentation/goal_detail_screen.dart test/features/guards test/features/goals/goal_detail_screen_test.dart

      - name: Run Return and guard tests
        run: flutter test test/features/guards test/features/goals/goal_detail_screen_test.dart

      - name: Fail on Flutter formatting or analysis drift
        if: always() && (steps.dart-format.outcome == 'failure' || steps.flutter-analyze.outcome == 'failure')
        shell: pwsh
        run: exit 1

  laravel-return-guards:
    name: Laravel Return / guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Install Laravel dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel test environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Normalize and check focused PHP style
        id: php-format
        continue-on-error: true
        run: |
          ./vendor/bin/pint app/Domain/Sync/ApplyGoalSyncMutation.php app/Domain/Sync/GoalGuardSelectionSyncMutation.php app/Models/GoalGuardSelection.php database/migrations/*goal_guard*.php tests/Feature/Goals/GoalGuardSelectionSyncTest.php
          git diff --check
          git diff --exit-code -- app/Domain/Sync/ApplyGoalSyncMutation.php app/Domain/Sync/GoalGuardSelectionSyncMutation.php app/Models/GoalGuardSelection.php database/migrations/*goal_guard*.php tests/Feature/Goals/GoalGuardSelectionSyncTest.php

      - name: Run guard sync tests
        run: php artisan test tests/Feature/Goals/GoalGuardSelectionSyncTest.php

      - name: Fail on committed PHP formatting drift
        if: always() && steps.php-format.outcome == 'failure'
        run: exit 1
