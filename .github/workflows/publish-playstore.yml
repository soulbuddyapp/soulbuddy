name: Publish Android release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: play-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish Android bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/soulbuddy

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.35.7
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.21.0
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Restore Android signing material
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF
          test -s android/upload-keystore.jks

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Verify bundled Scripture database
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path

          database_path = Path('assets/scripture/rsvce.db')
          if not database_path.is_file() or database_path.stat().st_size == 0:
              raise SystemExit('The bundled Scripture database is missing or empty.')
          with sqlite3.connect(database_path) as connection:
              tables = {
                  row[0]
                  for row in connection.execute(
                      "SELECT name FROM sqlite_master WHERE type = 'table'"
                  )
              }
          required_tables = {'books', 'chapters', 'verses'}
          if not required_tables <= tables:
              raise SystemExit('The bundled Scripture database has an unexpected schema.')
          PY

      - name: Run Flutter tests
        run: flutter test

      - name: Build signed Android App Bundle
        id: build
        run: |
          version_name="${GITHUB_REF_NAME#v}"
          if ! [[ "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use a semantic version such as v1.2.3." >&2
            exit 1
          fi
          build_number=$((1000 + GITHUB_RUN_NUMBER))
          flutter build appbundle --release --build-name "$version_name" --build-number "$build_number"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Upload Android App Bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: soulbuddy-${{ steps.build.outputs.version_name }}.aab
          path: apps/soulbuddy/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Publish to Google Play internal testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.soulbuddy.soulbuddy
          releaseFiles: apps/soulbuddy/build/app/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
          releaseName: ${{ github.ref_name }}